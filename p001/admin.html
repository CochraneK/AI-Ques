<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P001 · 管理员研究配置</title>
<style>
:root{--bg:#fff8f1;--paper:#fffdf9;--ink:#302923;--muted:#756a61;--line:#eaded1;--accent:#7c6cf2;--mint:#6acaa6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#fff 0,#fff8f1 46%,#f5ede5 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{width:min(900px,100%);margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.top a{color:var(--muted);text-decoration:none}.sheet{background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 26px 60px rgba(66,44,26,.10)}
.kicker{font-size:11px;letter-spacing:.15em;color:#8e7f73}h1{font:600 40px/1.15 "Songti SC","STSong",serif;margin:10px 0}.muted{color:var(--muted);line-height:1.7}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.mode{display:block;border:1px solid var(--line);border-radius:22px;padding:18px;background:#fff;cursor:pointer;transition:.2s}.mode.on{outline:3px solid rgba(124,108,242,.14);border-color:#a99df6;background:#fbfaff}.mode input{display:none}.mode strong{display:block;font-size:20px;margin-bottom:7px}.mode span{display:block;color:var(--muted);font-size:13px;line-height:1.55}.badge{display:inline-block!important;width:max-content;margin-top:10px!important;padding:5px 8px;border-radius:999px;background:#f2ecff;color:#6c5ed0!important;font-size:11px!important;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.field{border:1px solid var(--line);border-radius:18px;background:#fff;padding:15px}.field label{display:block;font-weight:700;margin-bottom:6px}.field select,.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.examples{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.ex{padding:12px;border-radius:15px;background:#f7f1ea;text-align:center}.ex b{display:block;font-size:20px}.actions{display:flex;gap:10px;margin-top:22px}.btn{border:0;border-radius:15px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:#fff}.soft{background:#eee5dc}.status{margin-top:12px;font-size:12px;color:#5f8f74}.warning{margin-top:16px;padding:13px 14px;border-radius:16px;background:#fff0df;border:1px solid #f0d2b0;color:#70543a;font-size:12px;line-height:1.6}
@media(max-width:700px){.mode-grid,.row,.examples{grid-template-columns:1fr}.sheet{padding:20px}h1{font-size:32px}}
</style>
</head>
<body><div class="wrap"><div class="top"><a href="../">← AI-Ques 首页</a><a href="./">打开 P001 ↗</a></div>
<div class="sheet"><div class="kicker">P001 · RESEARCH CONFIG</div><h1>成对比对模式</h1>
<p class="muted">这个开关只属于研究/管理员配置，不在学生端出现。GitHub Pages 版配置保存在当前浏览器；正式收数版应由认证后台统一下发。</p>
<div class="mode-grid">
<label class="mode" id="adaptiveCard"><input type="radio" name="mode" value="adaptive"><strong>取舍比对</strong><span>先保证比较图连通与基本覆盖，再优先比较当前最难区分的候选。适合恢复 Top 3 / Top 5，同时控制负担。</span><span class="badge">默认研究模式</span></label>
<label class="mode" id="fullCard"><input type="radio" name="mode" value="full"><strong>全量比对</strong><span>筛选后留下的所有候选，两两唯一比较一次。比较最完整，但候选多时场次增长非常快。</span><span class="badge">完整个体内排序</span></label>
</div>
<div class="row">
<div class="field"><label>取舍模式基础预算</label><select id="budget"><option value="18">18 场</option><option value="24">24 场</option><option value="30">30 场</option><option value="36">36 场</option></select><small class="muted">实际会同时保证最低覆盖；全量模式忽略这个预算。</small></div>
<div class="field"><label>估算全量场次</label><input id="nItems" type="number" min="2" max="30" value="12"><small class="muted">输入筛选后留下的候选数。</small></div>
</div>
<div class="examples"><div class="ex"><span>候选数</span><b id="nOut">12</b></div><div class="ex"><span>全量场次</span><b id="pairsOut">66</b></div><div class="ex"><span>公式</span><b>n(n−1)/2</b></div></div>
<div class="warning">全量比对更适合精确完整排序；取舍比对更适合有限预算下恢复核心优先项。两种模式都继续使用相同的点击语义：<b>点哪张，哪张被划掉；另一张记为 preferred。</b></div>
<div class="actions"><button class="btn primary" id="save">保存研究配置</button><button class="btn soft" id="reset">恢复默认</button></div><div class="status" id="status"></div>
</div></div>
<script>
const KEY='bjtu.p001.pages.settings.v1';
const defaults={assignment_mode:'playful',orb_theme:'sunlight',future_horizon_key:'future',future_horizon_label:'未来',future_horizon_months:null,stj_mode:'adaptive',stj_budget:24};
const read=()=>{try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...defaults}}};
const q=s=>document.querySelector(s);
function paint(){const s=read();document.querySelectorAll('input[name=mode]').forEach(x=>x.checked=x.value===s.stj_mode);q('#budget').value=String(s.stj_budget||24);syncCards()}
function syncCards(){document.querySelectorAll('.mode').forEach(c=>c.classList.toggle('on',c.querySelector('input').checked));q('#budget').disabled=q('input[name=mode]:checked')?.value==='full'}
function estimate(){const n=Math.max(2,Math.min(30,Number(q('#nItems').value)||2));q('#nOut').textContent=n;q('#pairsOut').textContent=n*(n-1)/2}
document.querySelectorAll('input[name=mode]').forEach(x=>x.onchange=syncCards);q('#nItems').oninput=estimate;
q('#save').onclick=()=>{const old=read();old.stj_mode=q('input[name=mode]:checked')?.value||'adaptive';old.stj_budget=Number(q('#budget').value)||24;localStorage.setItem(KEY,JSON.stringify(old));q('#status').textContent='已保存。下一位进入 P001 的参与者会使用这个模式。'};
q('#reset').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(defaults));paint();q('#status').textContent='已恢复默认：取舍比对 · 24 场基础预算。'};
paint();estimate();
</script></body></html>
