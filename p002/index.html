<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="description" content="P002：PCL-5 与 Current CAPE-P15 不同交互形式的研究原型。" />
  <title>P002 · 心理测评交互实验</title>
  <link rel="stylesheet" href="styles.css?v=20260915-r1" />
</head>
<body>
  <a class="skip-link" href="#launcher">跳到实验选择</a>

  <header class="topbar">
    <a class="wordmark" href="../" aria-label="返回 P00 总入口">
      <span class="mark">02</span>
      <span><strong>P002</strong><small>PCL × CAPE interaction lab</small></span>
    </a>
    <div class="top-meta">
      <a href="../">所有模块 ↗</a>
    </div>
  </header>

  <main class="shell">
    <section class="intro">
      <div>
        <p class="eyebrow">P002 · PCL-5 × CURRENT CAPE-P15</p>
        <h1>选择一种方式，<br><span>完成这次体验。</span></h1>
      </div>
      <div class="intro-copy">
        <p>直接问卷、故事版、Emoji、情境选择或互动小说。</p>
        <p class="research-note"><strong>研究原型，不用于诊断。</strong> 当前中文题干仍是原型转述。</p>
      </div>
    </section>

    <section id="launcher" class="launcher" aria-labelledby="launcherTitle">
      <div class="launcher-head">
        <h2 id="launcherTitle">开始</h2>
      </div>

      <div class="launcher-grid">
        <section class="step-block" aria-labelledby="scaleTitle">
          <div class="step-title"><span>01</span><div><h3 id="scaleTitle">量表</h3></div></div>
          <div id="scaleChoices" class="choice-grid scales"></div>
        </section>
        <section class="step-block" aria-labelledby="modeTitle">
          <div class="step-title"><span>02</span><div><h3 id="modeTitle">方式</h3></div></div>
          <div id="modeChoices" class="choice-grid modes"></div>
        </section>
      </div>

      <div class="launch-bar">
        <button id="startBtn" class="primary" disabled>开始体验 <span aria-hidden="true">→</span></button>
      </div>
    </section>

    <section id="game" class="game-shell hidden" aria-live="polite">
      <div class="game-topbar">
        <button id="backBtn" class="ghost">← 返回</button>
        <div class="progress-wrap" aria-hidden="true"><div id="progressBar" class="progress"></div></div>
        <div id="progressText" class="progress-text"></div>
      </div>
      <div id="gameBody"></div>
    </section>

    <section id="result" class="result-shell hidden"></section>

    <footer>
      <p>P002 · 研究原型 · 不用于诊断</p>
    </footer>
  </main>

  <script src="../shared/profile.js?v=1"></script>
  <script src="app.js?v=20260915-r1"></script>
</body>
</html>
