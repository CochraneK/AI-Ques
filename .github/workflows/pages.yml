name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build minimal static artifact
        run: |
          set -euo pipefail
          mkdir -p _site/shared _site/p002 _site/p004 _site/p005 _site/future-me

          cp index.html app.js styles.css module-registry.json _site/
          cp shared/profile.js _site/shared/

          cp p002/index.html p002/app.js p002/experiments.js p002/styles.css _site/p002/
          cp p004/index.html p004/app.js p004/api-client.js p004/styles.css _site/p004/
          cp p005/index.html p005/app.js p005/api-client.js p005/styles.css p005/runtime-config.js p005/admin.html p005/admin.js p005/admin.css _site/p005/
          cp future-me/index.html _site/future-me/

          touch _site/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
