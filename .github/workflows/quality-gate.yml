name: AI-Ques Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-sensor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run quality sensor
        run: python scripts/quality_sensor.py --strict

      - name: Show next improvement target
        if: always()
        run: python scripts/next_quality_target.py
