name: AI-Ques Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-sensor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check experiments.js
          node --check future-me/app.js
          node --check shared/core.js
          node --check portal/app.js
          node --check admin/app.js
          node --check p002/app.js
          node --check p004/global-adapter.js
          node --check future-me/global-adapter.js

      - name: Run behavior smoke tests
        run: |
          node tests/smoke.mjs
          node tests/global-p002-smoke.mjs

      - name: Run quality sensor
        run: python scripts/quality_sensor.py --strict

      - name: Show next improvement target
        if: always()
        run: python scripts/next_quality_target.py