name: P00 Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check shared/profile.js
          node --check shared/config.js
          node --check shared/core.js
          node --check p001/app.js
          node --check p001/report.js
          node --check p001/static-api.js
          node --check p002/condition-config.js
          node --check p002/app.js
          node --check p002/admin.js
          node --check p004/core.js
          node --check p004/app.js
          node --check p004/api-client.js
          node --check tests/p004-runtime.mjs
          node --check p005/app.js
          node --check p005/api-client.js
          node --check p005/admin.js
          node --check tests/p005-runtime.mjs
          node --check tests/smoke.mjs
          node --check tests/structure.mjs

      - name: Check Python syntax
        run: python -m py_compile scripts/quality_sensor.py

      - name: Run P002 behavior smoke tests
        run: node tests/smoke.mjs

      - name: Run P004 runtime behavior checks
        run: node tests/p004-runtime.mjs

      - name: Run P005 runtime behavior checks
        run: node tests/p005-runtime.mjs

      - name: Run repository structure checks
        run: node tests/structure.mjs

      - name: Run repository quality sensor
        run: python scripts/quality_sensor.py --strict
